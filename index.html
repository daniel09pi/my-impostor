<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Impostor</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0c0c0e;
      --surface: #141416;
      --border:  #222226;
      --text:    #f0f0f0;
      --muted:   #555560;
      --dim:     #30303a;
      --accent:  #ff3b5c;
      --green:   #00c896;
      --blue:    #3d8ef8;
    }

    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Lang toggle ── */
    #lang-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 30;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: .72rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      letter-spacing: .08em;
      transition: color .2s, border-color .2s;
      font-family: inherit;
    }
    #lang-toggle:hover { color: var(--text); border-color: var(--dim); }

    /* ── Screens ── */
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 420px;
      padding: 32px 20px;
    }
    .screen.active { display: flex; }

    /* ── Typography ── */
    .title {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -.02em;
      color: var(--text);
    }
    .title span { color: var(--accent); }
    .subtitle {
      font-size: .95rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.55;
      font-weight: 400;
    }
    .label {
      font-size: .7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
    }

    /* ── Input ── */
    .input-row { display: flex; gap: 8px; width: 100%; }
    input[type="text"] {
      flex: 1;
      padding: 13px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: .95rem;
      font-family: inherit;
      outline: none;
      transition: border-color .2s;
    }
    input[type="text"]:focus { border-color: var(--dim); }
    input::placeholder { color: var(--muted); }

    /* ── Buttons ── */
    .btn {
      padding: 13px 20px;
      border-radius: 10px;
      border: none;
      font-size: .95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      width: 100%;
      transition: opacity .15s, transform .1s;
      letter-spacing: -.01em;
    }
    .btn:active  { transform: scale(.98); }
    .btn:disabled { opacity: .25; cursor: default; }

    .btn-primary  { background: var(--accent); color: #fff; }
    .btn-green    { background: var(--green);  color: #0c0c0e; }
    .btn-ghost    {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--dim); color: var(--text); }
    .btn-icon {
      width: auto;
      padding: 13px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1.1rem;
    }

    /* ── Player list ── */
    #player-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
    }
    .player-tag {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      font-size: .9rem;
      font-weight: 500;
    }
    .player-tag button {
      background: none; border: none;
      color: var(--muted); font-size: 1rem;
      cursor: pointer; line-height: 1;
      transition: color .15s;
    }
    .player-tag button:hover { color: var(--accent); }

    /* ── Role card ── */
    .role-card {
      width: 100%;
      background: var(--surface);
      border-radius: 16px;
      padding: 40px 28px;
      text-align: center;
    }
    .role-card .pname {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 32px;
      color: var(--text);
    }
    .big-word {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: 1;
      margin-bottom: 8px;
    }
    .big-word.real     { color: var(--text); }
    .big-word.impostor { color: var(--accent); }
    .word-note {
      font-size: .78rem;
      color: var(--muted);
      font-weight: 400;
      margin-bottom: 28px;
    }
    .role-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: .72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .role-pill.crewmate { background: rgba(0,200,150,.1); color: var(--green); }
    .role-pill.impostor { background: rgba(255,59,92,.1);  color: var(--accent); }

    /* ── Cover / overlays ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 10;
      cursor: pointer;
      user-select: none;
    }
    .overlay.hidden { display: none; }
    .overlay .ov-name {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -.02em;
    }
    .overlay .ov-hint { font-size: .85rem; color: var(--muted); margin-top: 4px; }
    .overlay .ov-tap  { font-size: .72rem; color: var(--dim);   margin-top: 16px; }

    /* ── Discuss screen ── */
    .discuss-note {
      font-size: .82rem;
      color: var(--accent);
      text-align: center;
      font-weight: 500;
    }
    .players-row {
      font-size: .8rem;
      color: var(--muted);
      text-align: center;
    }

    /* ── Vote grid ── */
    #vote-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .vote-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px 10px;
      text-align: center;
      cursor: pointer;
      font-size: .95rem;
      font-weight: 600;
      transition: background .15s, border-color .15s, transform .1s;
    }
    .vote-card:hover  { background: #1e1e22; border-color: var(--dim); }
    .vote-card:active { transform: scale(.96); }

    /* ── Result cards ── */
    .result-card {
      width: 100%;
      background: var(--surface);
      border-radius: 16px;
      padding: 36px 24px;
      text-align: center;
    }
    .result-icon {
      font-size: 3.2rem;
      margin-bottom: 16px;
    }
    .result-head {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -.02em;
      margin-bottom: 12px;
    }
    .result-head.win  { color: var(--green); }
    .result-head.lose { color: var(--accent); }
    .result-body {
      font-size: .88rem;
      color: var(--muted);
      line-height: 1.7;
      white-space: pre-line;
    }

    /* ── Confirm modal ── */
    #confirm-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.8);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    #confirm-modal.hidden { display: none; }
    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 22px;
      max-width: 320px;
      width: 90%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-box .modal-title {
      font-size: 1.05rem;
      font-weight: 700;
      text-align: center;
    }
    .modal-box .modal-sub {
      font-size: .88rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
    }
    .modal-btns { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }

    /* ── Divider ── */
    .divider { width: 100%; height: 1px; background: var(--border); }

    /* ── Start overlay extras ── */
    .so-badge {
      font-size: .7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

<button id="lang-toggle">DE</button>

<!-- ── Setup ── -->
<div class="screen active" id="screen-setup">
  <div style="width:100%;margin-bottom:8px;">
    <div class="title">My <span>Impostor</span></div>
  </div>
  <p class="subtitle" data-t="setup-desc"></p>
  <div class="divider"></div>

  <div class="input-row">
    <input type="text" id="name-input" data-t-placeholder="player-placeholder" maxlength="20" />
    <button class="btn btn-icon" id="add-btn">+</button>
  </div>
  <div id="player-list"></div>

  <button class="btn btn-primary" id="start-btn" disabled data-t="start-btn"></button>
  <p class="label" data-t="min-players"></p>
</div>

<!-- ── Role Reveal ── -->
<div class="screen" id="screen-reveal">
  <div class="role-card">
    <div class="pname" id="reveal-name"></div>
    <div class="word-note" id="reveal-word-label"></div>
    <div class="big-word" id="reveal-word"></div>
    <div style="height:20px;"></div>
    <div class="role-pill" id="reveal-badge"></div>
  </div>
  <button class="btn btn-ghost" id="next-reveal-btn" data-t="next-btn"></button>
  <p class="label" data-t="reveal-hint"></p>
</div>

<!-- ── Discussion ── -->
<div class="screen" id="screen-discuss">
  <div style="width:100%;">
    <div class="title" data-t="discuss-title"></div>
  </div>
  <p class="subtitle" data-t="discuss-desc"></p>
  <p class="discuss-note" data-t="discuss-imp"></p>
  <div class="divider"></div>
  <p class="players-row" id="discuss-players"></p>
  <button class="btn btn-primary" id="go-vote-btn" data-t="vote-btn"></button>
</div>

<!-- ── Voting ── -->
<div class="screen" id="screen-vote">
  <div style="width:100%;">
    <div class="title" data-t="vote-title"></div>
  </div>
  <p class="subtitle" data-t="vote-desc"></p>
  <div id="vote-grid"></div>
</div>

<!-- ── Eject Result ── -->
<div class="screen" id="screen-eject">
  <div class="result-card">
    <div class="result-icon" id="eject-emoji"></div>
    <div class="result-head" id="eject-title"></div>
    <div class="result-body" id="eject-info"></div>
  </div>
  <button class="btn btn-green"  id="next-round-btn" data-t="continue-btn"></button>
  <button class="btn btn-ghost"  id="new-game-btn2"  data-t="new-game-btn"></button>
</div>

<!-- ── Game Over ── -->
<div class="screen" id="screen-gameover">
  <div class="result-card">
    <div class="result-icon" id="go-emoji"></div>
    <div class="result-head" id="go-title"></div>
    <div class="result-body" id="go-info"></div>
  </div>
  <button class="btn btn-primary" id="new-game-btn" data-t="new-game-btn"></button>
</div>

<!-- Cover -->
<div class="overlay hidden" id="cover">
  <div class="ov-name" id="cover-name"></div>
  <div class="ov-hint" data-t="cover-hint"></div>
  <div class="ov-tap"  data-t="cover-tap"></div>
</div>

<!-- Start overlay -->
<div class="overlay hidden" id="start-overlay">
  <div class="so-badge" data-t="starts-label"></div>
  <div class="ov-name" id="so-name"></div>
  <div class="ov-hint" data-t="starts-sub"></div>
  <div class="ov-tap"  data-t="cover-tap"></div>
</div>

<!-- Confirm modal -->
<div id="confirm-modal" class="hidden">
  <div class="modal-box">
    <div class="modal-title" data-t="confirm-title"></div>
    <div class="modal-sub" id="confirm-text"></div>
    <div class="modal-btns">
      <button class="btn btn-primary" id="confirm-ok"     data-t="confirm-ok"></button>
      <button class="btn btn-ghost"   id="confirm-cancel" data-t="confirm-cancel"></button>
    </div>
  </div>
</div>

<script>
// ── Translations ──

    "next-btn":              "Weiter →",
    "reveal-hint":           "Zeig niemandem dein Wort",
    "reveal-sub":            "Dein Wort ist",
    "reveal-crewmate-label": "Dein Wort ist",
    "reveal-impostor-label": "Du bist der Impostor — dein Hinweis ist",
    "badge-crewmate":        "Crewmate",
    "badge-impostor":        "Impostor",
    "discuss-title":         "Diskussion",
    "discuss-desc":          "Jeder beschreibt das Wort mit einem Satz, ohne es direkt zu sagen.",
    "discuss-imp":           "Der Impostor spielt mit, ohne das echte Wort zu kennen.",
    "vote-btn":              "Abstimmen",
    "vote-title":            "Abstimmung",
    "vote-desc":             "Wer ist der Impostor?",
    "continue-btn":          "Weiter",
    "new-game-btn":          "Neues Spiel",
    "cover-hint":            "Tippe um dein Wort zu sehen",
    "cover-tap":             "Andere bitte wegschauen",
    "starts-label":          "Fängt an",
    "starts-sub":            "Du startest die Diskussion",
    "confirm-title":         "Sicher?",
    "confirm-ok":            "Ja, rauswerfen",
    "confirm-cancel":        "Abbrechen",
    "confirm-msg":  n  => `${n} rauswerfen?`,
    "caught":       n  => `${n} war der Impostor`,
    "was-impostor": (n,w,h) => `Das Wort war: ${w}\nDer Hinweis des Impostors war: ${h}`,
    "innocent":     n  => `${n} war unschuldig`,
    "was-crewmate": n  => `${n} war ein Crewmate.\n\nDer Impostor ist noch unter euch.\nDas Wort bleibt gleich — weiter!`,
    "crew-wins":    () => `Crewmates gewinnen`,
    "crew-wins-info": (w,i) => `Der Impostor wurde gefunden.\n\nDas Wort war: ${w}\nImpostor: ${i}`,
    "imp-wins":     i  => `${i} gewinnt`,
    "imp-wins-info":(w,h) => `Der Impostor hat gewonnen.\n\nDas Wort war: ${w}\nSein Hinweis war: ${h}`,
  }
};

const WORDS = {
  es: [
    ["Pizza","Sushi"],["Perro","Caballo"],["Playa","Bosque"],["Manzana","Zanahoria"],
    ["Coche","Barco"],["Fútbol","Tenis"],["Guitarra","Piano"],["Sol","Estrella"],
    ["Hospital","Colegio"],["Avión","Bicicleta"],["Maleta","Cartera"],["Piscina","Sauna"],
    ["Fuego","Agua"],["Castillo","Tienda de campaña"],["Gato","Pájaro"],["Café","Zumo"],
    ["Chocolate","Sal"],["Puente","Escalera"],["Lluvia","Viento"],["Biblioteca","Supermercado"],
    ["Nevera","Horno"],["Profesor","Médico"],["Tiburón","Águila"],["Desierto","Glaciar"],
    ["Vela","Rayo"],["Espejo","Cuadro"],["Calcetín","Guante"],["Panadero","Peluquero"],
    ["Cama","Sofá"],["Cumpleaños","Nochevieja"],["Faro","Iglesia"],["Cactus","Seta"],
    ["Boxeo","Natación"],["Selva","Tundra"],["Moneda","Sello"],["Cuchara","Tijeras"],
    ["Espada","Maza"],["Caballero","Pirata"],["Abeja","Hormiga"],["Cine","Estadio"],
    ["Volcán","Géiser"],["Globo","Cometa"],["Serpiente","Gusano"],["Pingüino","Oso polar"],

    ["Auto","Schiff"],["Fußball","Tennis"],["Gitarre","Klavier"],["Sonne","Stern"],
    ["Krankenhaus","Schule"],["Flugzeug","Fahrrad"],["Koffer","Brieftasche"],["Schwimmbad","Sauna"],

    ["Kerze","Blitz"],["Spiegel","Gemälde"],["Socke","Handschuh"],["Bäcker","Friseur"],

    ["Diamant","Muschel"],["Schneemann","Sandburg"],
  ]
};

// ── State ──
let lang     = localStorage.getItem('imp-lang') || 'es';
let players  = JSON.parse(localStorage.getItem('imp-players') || '[]');
let revealIndex = 0, currentWord = null, currentHint = null;
let impostorName = null, eliminated = [], pendingEject = null;

// ── Helpers ──
const $ = id => document.getElementById(id);
const t = key => { const v = T[lang][key]; return typeof v === 'string' ? v : key; };
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function savePlayers() { localStorage.setItem('imp-players', JSON.stringify(players)); }

// ── Language ──
function applyLang() {
  document.documentElement.lang = lang;
  $('lang-toggle').textContent = lang === 'es' ? 'DE' : 'ES';
  document.querySelectorAll('[data-t]').forEach(el => {
    const v = T[lang][el.dataset.t];
    if (typeof v === 'string') el.textContent = v;
  });
  document.querySelectorAll('[data-t-placeholder]').forEach(el => {
    const v = T[lang][el.dataset.tPlaceholder];
    if (v) el.placeholder = v;
  });
  localStorage.setItem('imp-lang', lang);
}
$('lang-toggle').onclick = () => { lang = lang === 'es' ? 'de' : 'es'; applyLang(); };

// ── Setup ──
function renderPlayerList() {
  const list = $('player-list');
  list.innerHTML = '';
  players.forEach((name, i) => {
    const div = document.createElement('div');
    div.className = 'player-tag';
    div.innerHTML = `<span>${name}</span><button onclick="removePlayer(${i})">✕</button>`;
    list.appendChild(div);
  });
  $('start-btn').disabled = players.length < 3;
}
$('add-btn').onclick = addPlayer;
$('name-input').addEventListener('keydown', e => { if (e.key === 'Enter') addPlayer(); });
function addPlayer() {
  const val = $('name-input').value.trim();
  if (!val || players.map(p => p.toLowerCase()).includes(val.toLowerCase())) {
    $('name-input').value = ''; return;
  }
  players.push(val);
  $('name-input').value = '';
  savePlayers(); renderPlayerList();
}
window.removePlayer = function(i) { players.splice(i, 1); savePlayers(); renderPlayerList(); };

// ── Start ──
$('start-btn').onclick = function() {
  const pair = WORDS[lang][Math.floor(Math.random() * WORDS[lang].length)];
  currentWord = pair[0]; currentHint = pair[1];
  impostorName = shuffle(players)[0];
  eliminated = []; revealIndex = 0;
  showCover();
};

// ── Cover ──
function showCover() {
  const alive = players.filter(p => !eliminated.includes(p));
  if (revealIndex >= alive.length) {
    const starter = alive[Math.floor(Math.random() * alive.length)];
    $('so-name').textContent = starter;
    const ov = $('start-overlay');
    ov.classList.remove('hidden');
    ov.onclick = () => {
      ov.classList.add('hidden');
      show('screen-discuss');
      $('discuss-players').textContent = alive.join('  ·  ');
    };
    return;
  }
  const name = alive[revealIndex];
  $('cover-name').textContent = name;
  const cover = $('cover');
  cover.classList.remove('hidden');
  cover.onclick = () => { cover.classList.add('hidden'); showReveal(name); };
}

// ── Reveal ──
function showReveal(name) {
  show('screen-reveal');
  const imp = name === impostorName;
  $('reveal-name').textContent = name;
  $('reveal-word-label').textContent = t(imp ? 'reveal-impostor-label' : 'reveal-crewmate-label');
  $('reveal-word').textContent  = imp ? currentHint : currentWord;
  $('reveal-word').className    = 'big-word ' + (imp ? 'impostor' : 'real');
  $('reveal-badge').textContent = t(imp ? 'badge-impostor' : 'badge-crewmate');
  $('reveal-badge').className   = 'role-pill ' + (imp ? 'impostor' : 'crewmate');
}
$('next-reveal-btn').onclick = () => { revealIndex++; showCover(); };

// ── Vote ──
$('go-vote-btn').onclick = () => { show('screen-vote'); buildVoteGrid(); };
function buildVoteGrid() {
  const alive = players.filter(p => !eliminated.includes(p));
  const grid = $('vote-grid');
  grid.innerHTML = '';
  alive.forEach(name => {
    const c = document.createElement('div');
    c.className = 'vote-card';
    c.textContent = name;
    c.onclick = () => confirmEject(name);
    grid.appendChild(c);
  });
}

// ── Confirm ──
function confirmEject(name) {
  pendingEject = name;
  $('confirm-text').textContent = T[lang]['confirm-msg'](name);
  $('confirm-modal').classList.remove('hidden');
}
$('confirm-cancel').onclick = () => { $('confirm-modal').classList.add('hidden'); pendingEject = null; };
$('confirm-ok').onclick = () => {
  $('confirm-modal').classList.add('hidden');
  if (pendingEject) ejectPlayer(pendingEject);
  pendingEject = null;
};

// ── Eject ──
function ejectPlayer(name) {
  show('screen-eject');
  const imp = name === impostorName;
  if (imp) {
    $('eject-emoji').textContent = '🎉';
    $('eject-title').textContent = T[lang]['caught'](name);
    $('eject-title').className   = 'result-head win';
    $('eject-info').textContent  = T[lang]['was-impostor'](name, currentWord, currentHint);
    $('next-round-btn').style.display = 'none';
    setTimeout(() => triggerGameOver('crew'), 80);
  } else {
    $('eject-emoji').textContent = '😬';
    $('eject-title').textContent = T[lang]['innocent'](name);
    $('eject-title').className   = 'result-head lose';
    $('eject-info').textContent  = T[lang]['was-crewmate'](name);   // ← no impostor name
    eliminated.push(name);
    const aliveAfter = players.filter(p => !eliminated.includes(p));
    if (aliveAfter.length <= 2) {
      $('next-round-btn').style.display = 'none';
      setTimeout(() => triggerGameOver('imp'), 80);
    } else {
      $('next-round-btn').style.display = '';
    }
  }
}
$('next-round-btn').onclick = () => {
  show('screen-discuss');
  $('discuss-players').textContent = players.filter(p => !eliminated.includes(p)).join('  ·  ');
};

// ── Game Over ──
function triggerGameOver(winner) {
  show('screen-gameover');
  if (winner === 'crew') {
    $('go-emoji').textContent = '🎉';
    $('go-title').textContent = T[lang]['crew-wins']();
    $('go-title').className   = 'result-head win';
    $('go-info').textContent  = T[lang]['crew-wins-info'](currentWord, impostorName);
  } else {
    $('go-emoji').textContent = '💀';
    $('go-title').textContent = T[lang]['imp-wins'](impostorName);
    $('go-title').className   = 'result-head lose';
    $('go-info').textContent  = T[lang]['imp-wins-info'](currentWord, currentHint);
  }
}

// ── Reset ──
function resetGame() { eliminated = []; revealIndex = 0; show('screen-setup'); }
$('new-game-btn').onclick  = resetGame;
$('new-game-btn2').onclick = resetGame;

applyLang();
renderPlayerList();
</script>
</body>
</html>
