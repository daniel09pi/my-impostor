<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Impostor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Language toggle */
    #lang-toggle {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 30;
      background: #16213e;
      border: 1px solid #444;
      border-radius: 20px;
      padding: 5px 14px;
      font-size: .8rem;
      font-weight: bold;
      color: #aaa;
      cursor: pointer;
      letter-spacing: 1px;
      transition: border-color .2s;
    }
    #lang-toggle:hover { border-color: #e94560; color: #eee; }

    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 480px;
      padding: 24px 16px;
    }
    .screen.active { display: flex; }

    h1 { font-size: 2.4rem; color: #e94560; letter-spacing: 2px; text-transform: uppercase; }
    h2 { font-size: 1.4rem; color: #a8dadc; }
    p  { text-align: center; line-height: 1.6; color: #ccc; }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 2px solid #333;
      background: #16213e;
      color: #eee;
      font-size: 1rem;
      outline: none;
      transition: border-color .2s;
    }
    input[type="text"]:focus { border-color: #e94560; }

    .btn {
      padding: 12px 32px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform .1s, opacity .2s;
      width: 100%;
    }
    .btn:active { transform: scale(.97); }
    .btn-red   { background: #e94560; color: #fff; }
    .btn-blue  { background: #457b9d; color: #fff; }
    .btn-green { background: #2a9d8f; color: #fff; }
    .btn-gray  { background: #2a2a3e; color: #aaa; border: 1px solid #444; }
    .btn:disabled { opacity: .35; cursor: default; }

    /* Player list */
    #player-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 240px;
      overflow-y: auto;
    }
    .player-tag {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #16213e;
      border-radius: 8px;
      padding: 10px 14px;
    }
    .player-tag button {
      background: none; border: none;
      color: #e94560; font-size: 1.1rem; cursor: pointer;
    }

    /* Role card */
    .role-card {
      width: 100%;
      background: #16213e;
      border-radius: 16px;
      padding: 36px 24px;
      text-align: center;
      border: 2px solid #2a2a4e;
    }
    .role-card .player-name { font-size: 1.5rem; font-weight: bold; margin-bottom: 4px; }
    .role-card .sub { font-size: .85rem; color: #555; margin-bottom: 28px; }

    .word-label { font-size: .85rem; color: #777; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .big-word {
      font-size: 2.8rem;
      font-weight: bold;
      letter-spacing: 2px;
      line-height: 1.1;
    }
    .big-word.real     { color: #a8dadc; }
    .big-word.impostor { color: #e94560; }

    .role-badge {
      display: inline-block;
      margin-top: 20px;
      padding: 5px 16px;
      border-radius: 20px;
      font-size: .8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .role-badge.crewmate { background: #1a3a38; color: #2a9d8f; }
    .role-badge.impostor { background: #3a1a20; color: #e94560; }

    /* Cover */
    #cover {
      position: fixed;
      inset: 0;
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 10;
      cursor: pointer;
      user-select: none;
    }
    #cover.hidden { display: none; }
    #cover .cover-name { font-size: 1.5rem; font-weight: bold; color: #a8dadc; }
    #cover .cover-hint { font-size: .9rem; color: #555; }
    #cover .cover-tap  { font-size: .8rem; color: #333; margin-top: 8px; }

    /* Voting */
    #vote-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .vote-card {
      background: #16213e;
      border: 2px solid #2a2a4e;
      border-radius: 14px;
      padding: 20px 12px;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s, background .15s, transform .1s;
      font-size: 1.05rem;
      font-weight: bold;
    }
    .vote-card:active { transform: scale(.95); }
    .vote-card:hover  { border-color: #e94560; background: #1e1e3e; }

    /* Eject / Result */
    .result-box {
      width: 100%;
      background: #16213e;
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      border: 2px solid #2a2a4e;
    }
    .result-emoji { font-size: 4rem; margin-bottom: 12px; }
    .result-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 10px; }
    .result-title.win  { color: #2a9d8f; }
    .result-title.lose { color: #e94560; }
    .result-info { font-size: .9rem; color: #aaa; line-height: 1.7; white-space: pre-line; }

    .divider { width: 100%; height: 1px; background: #2a2a4e; }
    .small { font-size: .8rem; color: #555; text-align: center; }

    /* Are you sure modal */
    #confirm-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    #confirm-modal.hidden { display: none; }
    .modal-box {
      background: #16213e;
      border: 2px solid #e94560;
      border-radius: 16px;
      padding: 28px 24px;
      max-width: 340px;
      width: 90%;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal-box h3 { font-size: 1.2rem; color: #eee; }
    .modal-box p  { font-size: .95rem; color: #aaa; margin: 0; }
    /* buttons stacked vertically */
    .modal-btns { display: flex; flex-direction: column; gap: 10px; }

    /* Starting player overlay */
    #start-overlay {
      position: fixed;
      inset: 0;
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      cursor: pointer;
    }
    #start-overlay.hidden { display: none; }
    #start-overlay .so-label { font-size: .9rem; color: #555; text-transform: uppercase; letter-spacing: 1px; }
    #start-overlay .so-name  { font-size: 2rem; font-weight: bold; color: #e94560; }
    #start-overlay .so-sub   { font-size: .9rem; color: #aaa; }
    #start-overlay .so-tap   { font-size: .8rem; color: #333; margin-top: 8px; }
  </style>
</head>
<body>

<button id="lang-toggle">DE</button>

<!-- ── SCREEN 1: Setup ── -->
<div class="screen active" id="screen-setup">
  <h1>Impostor</h1>
  <p data-t="setup-desc"></p>

  <p class="small" data-t="min-players"></p>
</div>

<!-- ── SCREEN 2: Role Reveal ── -->
<div class="screen" id="screen-reveal">
  <div class="role-card">
    <div class="player-name" id="reveal-name"></div>

    <div class="big-word" id="reveal-word"></div>

  </div>
  <button class="btn btn-blue" id="next-reveal-btn" data-t="next-btn"></button>
  <p class="small" data-t="reveal-hint"></p>
</div>

<!-- ── SCREEN 3: Discussion ── -->
<div class="screen" id="screen-discuss">
  <h2 data-t="discuss-title"></h2>
  <p data-t="discuss-desc"></p>
  <p style="color:#e94560;font-size:.9rem;" data-t="discuss-imp"></p>
  <div class="divider"></div>
  <p class="small" id="discuss-players"></p>
  <button class="btn btn-red" id="go-vote-btn" data-t="vote-btn"></button>
</div>

<!-- ── SCREEN 4: Voting ── -->
<div class="screen" id="screen-vote">
  <h2 data-t="vote-title"></h2>
  <p data-t="vote-desc"></p>
  <div id="vote-grid"></div>
</div>

<!-- ── SCREEN 5: Eject Result ── -->
<div class="screen" id="screen-eject">
  <div class="result-box">
    <div class="result-emoji" id="eject-emoji"></div>
    <div class="result-title" id="eject-title"></div>
    <div class="result-info" id="eject-info"></div>
  </div>
  <button class="btn btn-green" id="next-round-btn" data-t="continue-btn"></button>
  <button class="btn btn-gray"  id="new-game-btn2" data-t="new-game-btn"></button>
</div>

<!-- ── SCREEN 6: Game Over ── -->
<div class="screen" id="screen-gameover">
  <h1>Game Over</h1>
  <div class="result-box">
    <div class="result-emoji" id="go-emoji"></div>
    <div class="result-title" id="go-title"></div>
    <div class="result-info" id="go-info"></div>
  </div>
  <button class="btn btn-green" id="new-game-btn" data-t="new-game-btn"></button>
</div>

<!-- Cover between reveals -->
<div id="cover" class="hidden">
  <div class="cover-name" id="cover-name"></div>
  <p class="cover-hint" data-t="cover-hint"></p>
  <p class="cover-tap" data-t="cover-tap"></p>
</div>

<!-- Starting player overlay -->
<div id="start-overlay" class="hidden">
  <div class="so-label" data-t="starts-label"></div>
  <div class="so-name" id="so-name"></div>
  <div class="so-sub" data-t="starts-sub"></div>
  <div class="so-tap" data-t="cover-tap"></div>
</div>

<!-- Are you sure modal -->
<div id="confirm-modal" class="hidden">
  <div class="modal-box">
    <h3 data-t="confirm-title"></h3>

// ── State ──
let lang = localStorage.getItem('impostor-lang') || 'es';
let players = JSON.parse(localStorage.getItem('impostor-players') || '[]');
let revealIndex = 0;
let currentWord = null;
let currentHint = null;
let impostorName = null;
let eliminated = [];
let pendingEject = null;

// ── Helpers ──
const $ = id => document.getElementById(id);
const t = key => T[lang][key] || key;

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function savePlayers() {
  localStorage.setItem('impostor-players', JSON.stringify(players));
}

// ── Language ──
function applyLang() {
  document.documentElement.lang = lang;
  $('lang-toggle').textContent = lang === 'es' ? 'DE' : 'ES';
  document.querySelectorAll('[data-t]').forEach(el => {
    const key = el.dataset.t;
    const val = T[lang][key];
    if (val && typeof val === 'string') el.textContent = val;
  });
  document.querySelectorAll('[data-t-placeholder]').forEach(el => {
    const key = el.dataset.tPlaceholder;
    const val = T[lang][key];
    if (val) el.placeholder = val;
  });
  localStorage.setItem('impostor-lang', lang);
}

$('lang-toggle').onclick = function() {
  lang = lang === 'es' ? 'de' : 'es';
  applyLang();
};

// ── Setup ──
function renderPlayerList() {
  const list = $('player-list');
  list.innerHTML = '';
  players.forEach((name, i) => {
    const div = document.createElement('div');
    div.className = 'player-tag';
    div.innerHTML = `<span>${name}</span><button onclick="removePlayer(${i})">✕</button>`;
    list.appendChild(div);
  });
  $('start-btn').disabled = players.length < 3;
}

$('add-btn').onclick = addPlayer;
$('name-input').addEventListener('keydown', e => { if (e.key === 'Enter') addPlayer(); });

function addPlayer() {
  const val = $('name-input').value.trim();
  if (!val) return;
  if (players.map(p => p.toLowerCase()).includes(val.toLowerCase())) {
    $('name-input').value = ''; return;
  }
  players.push(val);
  $('name-input').value = '';
  savePlayers();
  renderPlayerList();
}

window.removePlayer = function(i) {
  players.splice(i, 1);
  savePlayers();
  renderPlayerList();
};

// ── Start Game ──
$('start-btn').onclick = function() {
  const wordList = WORDS[lang];
  const pair = wordList[Math.floor(Math.random() * wordList.length)];
  currentWord = pair[0];
  currentHint = pair[1];
  impostorName = shuffle(players)[0];
  eliminated = [];
  revealIndex = 0;
  showCover();
};

// ── Cover ──
function showCover() {
  const alive = players.filter(p => !eliminated.includes(p));
  if (revealIndex >= alive.length) {
    const starter = alive[Math.floor(Math.random() * alive.length)];
    $('so-name').textContent = starter;
    const overlay = $('start-overlay');
    overlay.classList.remove('hidden');
    overlay.onclick = function() {
      overlay.classList.add('hidden');
      show('screen-discuss');
      $('discuss-players').textContent = alive.join(' · ');
    };
    return;
  }
  const name = alive[revealIndex];
  $('cover-name').textContent = name;
  const cover = $('cover');
  cover.classList.remove('hidden');
  cover.onclick = function() {
    cover.classList.add('hidden');
    showReveal(name);
  };
}

// ── Reveal ──
function showReveal(name) {
  show('screen-reveal');
  const isImpostor = name === impostorName;
  $('reveal-name').textContent = name;
  $('reveal-sub').textContent = t('reveal-sub');

  if (isImpostor) {
    $('reveal-word-label').textContent = t('reveal-impostor-label');
    $('reveal-word').textContent = currentHint;
    $('reveal-word').className = 'big-word impostor';
    $('reveal-badge').textContent = t('badge-impostor');
    $('reveal-badge').className = 'role-badge impostor';
  } else {
    $('reveal-word-label').textContent = t('reveal-crewmate-label');
    $('reveal-word').textContent = currentWord;
    $('reveal-word').className = 'big-word real';
    $('reveal-badge').textContent = t('badge-crewmate');
    $('reveal-badge').className = 'role-badge crewmate';
  }
}

$('next-reveal-btn').onclick = function() {
  revealIndex++;
  showCover();
};

// ── Voting ──
$('go-vote-btn').onclick = function() {
  show('screen-vote');
  buildVoteGrid();
};

function buildVoteGrid() {
  const alive = players.filter(p => !eliminated.includes(p));
  const grid = $('vote-grid');
  grid.innerHTML = '';
  alive.forEach(name => {
    const card = document.createElement('div');
    card.className = 'vote-card';
    card.textContent = name;
    card.onclick = () => confirmEject(name);
    grid.appendChild(card);
  });
}

// ── Confirm modal ──
function confirmEject(name) {
  pendingEject = name;
  $('confirm-text').textContent = T[lang]['confirm-msg'](name);
  $('confirm-modal').classList.remove('hidden');
}

$('confirm-cancel').onclick = function() {
  $('confirm-modal').classList.add('hidden');
  pendingEject = null;
};

$('confirm-ok').onclick = function() {
  $('confirm-modal').classList.add('hidden');
  if (pendingEject) ejectPlayer(pendingEject);
  pendingEject = null;
};

// ── Eject ──
function ejectPlayer(name) {
  show('screen-eject');
  const isImpostor = name === impostorName;

  if (isImpostor) {
    $('eject-emoji').textContent = '🎉';
    $('eject-title').textContent = T[lang]['caught'](name);
    $('eject-title').className = 'result-title win';
    $('eject-info').textContent = T[lang]['was-impostor'](name, currentWord, currentHint);
    $('next-round-btn').style.display = 'none';
    setTimeout(() => triggerGameOver('crew'), 100);
  } else {
    $('eject-emoji').textContent = '😬';
    $('eject-title').textContent = T[lang]['innocent'](name);
    $('eject-title').className = 'result-title lose';
    $('eject-info').textContent = T[lang]['was-crewmate'](name, impostorName);
    eliminated.push(name);
    const aliveAfter = players.filter(p => !eliminated.includes(p));
    if (aliveAfter.length <= 2) {
      $('next-round-btn').style.display = 'none';
      setTimeout(() => triggerGameOver('imp'), 100);
    } else {
      $('next-round-btn').style.display = '';
    }
  }
}

// Continue same round (same word, no re-reveal)
$('next-round-btn').onclick = function() {
  show('screen-discuss');
  const alive = players.filter(p => !eliminated.includes(p));
  $('discuss-players').textContent = alive.join(' · ');
};

// ── Game Over ──
function triggerGameOver(winner) {
  show('screen-gameover');
  if (winner === 'crew') {
    $('go-emoji').textContent = '🎉';
    $('go-title').textContent = t('crew-wins');
    $('go-title').className = 'result-title win';
    $('go-info').textContent = T[lang]['crew-wins-info'](currentWord, impostorName);
  } else {
    $('go-emoji').textContent = '💀';
    $('go-title').textContent = T[lang]['imp-wins'](impostorName);
    $('go-title').className = 'result-title lose';
    $('go-info').textContent = T[lang]['imp-wins-info'](currentWord, currentHint);
  }
}

// ── New Game ──
function resetGame() {
  eliminated = [];
  revealIndex = 0;
  show('screen-setup');
}

$('new-game-btn').onclick  = resetGame;
$('new-game-btn2').onclick = resetGame;

// Init
applyLang();
renderPlayerList();
</script>
</body>
</html>
